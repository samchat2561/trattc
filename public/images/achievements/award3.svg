<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAward3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="50%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fdf4ff"/>
    </linearGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="plaqueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" fill="url(#bgGradAward3)"/>

  <!-- Ornamental Soft Circles -->
  <circle cx="70" cy="70" r="130" fill="#e9d5ff" opacity="0.35"/>
  <circle cx="530" cy="410" r="150" fill="#fde68a" opacity="0.35"/>
  <circle cx="530" cy="70" r="100" fill="#fbcfe8" opacity="0.3"/>

  <!-- Border Frame -->
  <rect x="12" y="12" width="576" height="456" rx="16" fill="none" stroke="url(#goldGrad3)" stroke-width="3" opacity="0.85"/>
  <rect x="18" y="18" width="564" height="444" rx="12" fill="none" stroke="#7e22ce" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Top Ribbon Banner -->
  <path d="M 320 25 L 570 25 L 585 45 L 570 65 L 320 65 Z" fill="url(#purpleGrad)"/>
  <text x="445" y="48" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    ★ รางวัลพระราชทาน ๒๕๖๘
  </text>

  <!-- College Logo Badge / Emblem -->
  <g transform="translate(45, 30)">
    <circle cx="28" cy="28" r="26" fill="#7a1a40" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="34" fill="#fef08a" font-family="'Sarabun', sans-serif" font-size="20" font-weight="black" text-anchor="middle">วทต</text>
  </g>
  <text x="110" y="48" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold">วิทยาลัยเทคนิคตราด</text>
  <text x="110" y="66" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11">Trat Technical College</text>

  <!-- Left Content Box: Announcement -->
  <g transform="translate(35, 105)">
    <rect x="0" y="0" width="295" height="330" rx="14" fill="#ffffff" opacity="0.92" stroke="#e9d5ff" stroke-width="1.5"/>

    <!-- Emblem Badge -->
    <circle cx="147" cy="42" r="24" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="147" y="50" font-size="24" text-anchor="middle">🎖️</text>

    <text x="147" y="85" fill="#581c87" font-family="'Sarabun', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
      เกียรติยศอันสูงสุด
    </text>
    <text x="147" y="107" fill="#b45309" font-family="'Sarabun', sans-serif" font-size="13" font-weight="semibold" text-anchor="middle">
      ความภาคภูมิใจของชาวเทคนิคตราด
    </text>

    <!-- Award Name Highlight Box -->
    <rect x="15" y="125" width="265" height="60" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1"/>
    <text x="147" y="148" fill="#6b21a8" font-family="'Sarabun', sans-serif" font-size="14.5" font-weight="black" text-anchor="middle">
      สถานศึกษารางวัลพระราชทาน
    </text>
    <text x="147" y="170" fill="#7e22ce" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ระดับการศึกษาวิชาชีพ (ขนาดใหญ่)
    </text>

    <!-- Recipient & Department -->
    <text x="147" y="215" fill="#1e293b" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      วิทยาลัยเทคนิคตราด
    </text>
    <text x="147" y="238" fill="#7e22ce" font-family="'Sarabun', sans-serif" font-size="12" font-weight="semibold" text-anchor="middle">
      สังกัดสำนักงานคณะกรรมการการอาชีวศึกษา
    </text>

    <line x1="30" y1="260" x2="265" y2="260" stroke="#d8b4fe" stroke-width="1"/>

    <!-- Pride Tagline -->
    <text x="147" y="285" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      มุ่งมั่นพัฒนาการศึกษาสู่ความเป็นเลิศ
    </text>
    <text x="147" y="306" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11" font-style="italic" text-anchor="middle">
      ผลิตกำลังคนคุณภาพสู่สากล
    </text>
  </g>

  <!-- Right: Royal Plaque Showcase Frame -->
  <g transform="translate(355, 105)">
    <rect x="0" y="0" width="210" height="330" rx="16" fill="#ffffff" filter="drop-shadow(0px 10px 15px rgba(0,0,0,0.08))"/>
    <rect x="0" y="0" width="210" height="330" rx="16" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>

    <!-- Plaque Visual -->
    <g transform="translate(15, 20)">
      <radialGradient id="plaqueGlow" cx="50%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#fffbeb"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </radialGradient>
      <rect x="0" y="0" width="180" height="200" rx="12" fill="url(#plaqueGlow)" stroke="#fde68a"/>

      <!-- Royal Plaque Board -->
      <rect x="25" y="20" width="130" height="160" rx="8" fill="#78350f" stroke="#451a03" stroke-width="2"/>
      <rect x="32" y="27" width="116" height="146" rx="6" fill="url(#plaqueGrad)" stroke="#b45309"/>

      <!-- Plaque Emblem & Crown outline -->
      <polygon points="90,40 98,55 82,55" fill="#78350f"/>
      <circle cx="90" cy="48" r="6" fill="#fbbf24"/>
      <rect x="42" y="70" width="96" height="4" fill="#78350f"/>
      <rect x="50" y="80" width="80" height="3" fill="#78350f"/>
      <rect x="45" y="90" width="90" height="3" fill="#78350f"/>
      <rect x="55" y="100" width="70" height="3" fill="#78350f"/>

      <!-- Seal Stamp -->
      <circle cx="90" cy="135" r="18" fill="#dc2626" opacity="0.9"/>
      <circle cx="90" cy="135" r="14" fill="none" stroke="#fef08a" stroke-width="1.5"/>
      <text x="90" y="139" fill="#fef08a" font-size="10" font-weight="bold" text-anchor="middle">เกียรติยศ</text>
    </g>

    <!-- Bottom Badge Section -->
    <rect x="15" y="235" width="180" height="75" rx="10" fill="#581c87"/>
    <text x="105" y="260" fill="#fde047" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ★ รางวัลเกียรติยศสูงสุด ★
    </text>
    <text x="105" y="280" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="11" text-anchor="middle">
      กระทรวงศึกษาธิการ
    </text>
    <text x="105" y="297" fill="#e9d5ff" font-family="'Sarabun', sans-serif" font-size="10" text-anchor="middle">
      ความภูมิใจของชาวจังหวัดตราด
    </text>
  </g>
</svg>

