<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAward1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="maroonGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a1a40"/>
      <stop offset="100%" stop-color="#9e1f55"/>
    </linearGradient>
    <linearGradient id="trophyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" fill="url(#bgGradAward1)"/>

  <!-- Ornamental Soft Circles -->
  <circle cx="60" cy="60" r="130" fill="#fde68a" opacity="0.35"/>
  <circle cx="540" cy="420" r="160" fill="#fbcfe8" opacity="0.3"/>
  <circle cx="530" cy="70" r="100" fill="#fed7aa" opacity="0.35"/>

  <!-- Gold Border Frame -->
  <rect x="12" y="12" width="576" height="456" rx="16" fill="none" stroke="url(#goldGrad1)" stroke-width="3" opacity="0.85"/>
  <rect x="18" y="18" width="564" height="444" rx="12" fill="none" stroke="#d97706" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Top Ribbon Banner: รางวัลและความสำเร็จ ๒๕๖๘ -->
  <path d="M 320 25 L 570 25 L 585 45 L 570 65 L 320 65 Z" fill="url(#maroonGrad1)"/>
  <text x="445" y="48" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    ★ รางวัลและความสำเร็จ ๒๕๖๘
  </text>

  <!-- College Logo Badge / Emblem -->
  <g transform="translate(45, 30)">
    <circle cx="28" cy="28" r="26" fill="#7a1a40" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="34" fill="#fef08a" font-family="'Sarabun', sans-serif" font-size="20" font-weight="black" text-anchor="middle">วทต</text>
  </g>
  <text x="110" y="48" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold">วิทยาลัยเทคนิคตราด</text>
  <text x="110" y="66" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11">Trat Technical College</text>

  <!-- Left Content Box: Achievement Announcement -->
  <g transform="translate(35, 105)">
    <rect x="0" y="0" width="295" height="330" rx="14" fill="#ffffff" opacity="0.9" stroke="#fed7aa" stroke-width="1.5"/>

    <!-- Trophy Icon Badge -->
    <circle cx="147" cy="42" r="24" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="147" y="50" font-size="24" text-anchor="middle">🏆</text>

    <text x="147" y="85" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
      ขอแสดงความยินดี
    </text>
    <text x="147" y="107" fill="#b45309" font-family="'Sarabun', sans-serif" font-size="13" font-weight="semibold" text-anchor="middle">
      ผลงานอันทรงคุณค่าระดับชาติ
    </text>

    <!-- Award Name Highlight Box -->
    <rect x="15" y="125" width="265" height="60" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
    <text x="147" y="150" fill="#92400e" font-family="'Sarabun', sans-serif" font-size="15" font-weight="black" text-anchor="middle">
      รางวัลชนะเลิศ เหรียญทอง
    </text>
    <text x="147" y="172" fill="#78350f" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      การประกวดสิ่งประดิษฐ์ของคนรุ่นใหม่ ระดับชาติ
    </text>

    <!-- Project & Department -->
    <text x="147" y="215" fill="#1e293b" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ผลงาน "ระบบสมาร์ตฟาร์มอัจฉริยะ IOT"
    </text>
    <text x="147" y="238" fill="#2563eb" font-family="'Sarabun', sans-serif" font-size="12" font-weight="semibold" text-anchor="middle">
      แผนกวิชาช่างอิเล็กทรอนิกส์และเทคโนโลยีสารสนเทศ
    </text>

    <line x1="30" y1="260" x2="265" y2="260" stroke="#fcd34d" stroke-width="1"/>

    <!-- Pride Tagline -->
    <text x="147" y="285" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      สร้างชื่อเสียงและความภาคภูมิใจ
    </text>
    <text x="147" y="306" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11" font-style="italic" text-anchor="middle">
      แด่วิทยาลัยเทคนิคตราด
    </text>
  </g>

  <!-- Right: Trophy Showcase Frame -->
  <g transform="translate(355, 105)">
    <rect x="0" y="0" width="210" height="330" rx="16" fill="#ffffff" filter="drop-shadow(0px 10px 15px rgba(0,0,0,0.08))"/>
    <rect x="0" y="0" width="210" height="330" rx="16" fill="#fffdfa" stroke="#f59e0b" stroke-width="2"/>

    <!-- Trophy Visual -->
    <g transform="translate(15, 20)">
      <radialGradient id="trophyGlow1" cx="50%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#fef9c3"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </radialGradient>
      <rect x="0" y="0" width="180" height="200" rx="12" fill="url(#trophyGlow1)" stroke="#fef08a"/>

      <!-- Large Trophy Drawing -->
      <!-- Cup Body -->
      <path d="M 50 40 L 130 40 L 120 100 C 115 125, 65 125, 60 100 Z" fill="url(#trophyGrad)" stroke="#a16207" stroke-width="2"/>
      <!-- Handles -->
      <path d="M 50 50 C 25 50, 25 85, 55 90" fill="none" stroke="url(#goldGrad1)" stroke-width="6" stroke-linecap="round"/>
      <path d="M 130 50 C 155 50, 155 85, 125 90" fill="none" stroke="url(#goldGrad1)" stroke-width="6" stroke-linecap="round"/>
      <!-- Stem -->
      <path d="M 85 120 L 95 120 L 97 145 L 83 145 Z" fill="url(#trophyGrad)" stroke="#a16207"/>
      <!-- Base -->
      <rect x="65" y="145" width="50" height="15" rx="3" fill="#78350f" stroke="#451a03"/>
      <rect x="55" y="160" width="70" height="20" rx="4" fill="#1e293b"/>
      <rect x="68" y="165" width="44" height="10" rx="2" fill="#fbbf24"/>
      <!-- Star on Cup -->
      <polygon points="90,55 93,65 103,65 95,71 98,81 90,75 82,81 85,71 77,65 87,65" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Bottom Badge Section -->
    <rect x="15" y="235" width="180" height="75" rx="10" fill="#7a1a40"/>
    <text x="105" y="260" fill="#fde047" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ★ ระดับยอดเยี่ยม ★
    </text>
    <text x="105" y="280" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="11" text-anchor="middle">
      ประจำปีการศึกษา ๒๕๖๘
    </text>
    <text x="105" y="297" fill="#cbd5e1" font-family="'Sarabun', sans-serif" font-size="10" text-anchor="middle">
      สำนักงานคณะกรรมการการอาชีวศึกษา
    </text>
  </g>
</svg>

