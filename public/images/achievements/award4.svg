<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAward4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="ribbonAwardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" fill="url(#bgGradAward4)"/>

  <!-- Ornamental Soft Circles -->
  <circle cx="70" cy="70" r="130" fill="#a7f3d0" opacity="0.35"/>
  <circle cx="530" cy="410" r="150" fill="#fed7aa" opacity="0.35"/>
  <circle cx="530" cy="70" r="100" fill="#bfdbfe" opacity="0.3"/>

  <!-- Border Frame -->
  <rect x="12" y="12" width="576" height="456" rx="16" fill="none" stroke="url(#goldGrad4)" stroke-width="3" opacity="0.85"/>
  <rect x="18" y="18" width="564" height="444" rx="12" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Top Ribbon Banner -->
  <path d="M 320 25 L 570 25 L 585 45 L 570 65 L 320 65 Z" fill="url(#greenGrad)"/>
  <text x="445" y="48" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    ★ รางวัลครูดีเด่นระดับชาติ ๒๕๖๘
  </text>

  <!-- College Logo Badge / Emblem -->
  <g transform="translate(45, 30)">
    <circle cx="28" cy="28" r="26" fill="#7a1a40" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="34" fill="#fef08a" font-family="'Sarabun', sans-serif" font-size="20" font-weight="black" text-anchor="middle">วทต</text>
  </g>
  <text x="110" y="48" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold">วิทยาลัยเทคนิคตราด</text>
  <text x="110" y="66" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11">Trat Technical College</text>

  <!-- Left Content Box: Announcement -->
  <g transform="translate(35, 105)">
    <rect x="0" y="0" width="295" height="330" rx="14" fill="#ffffff" opacity="0.92" stroke="#a7f3d0" stroke-width="1.5"/>

    <!-- Badge Icon -->
    <circle cx="147" cy="42" r="24" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="147" y="50" font-size="24" text-anchor="middle">🌟</text>

    <text x="147" y="85" fill="#065f46" font-family="'Sarabun', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
      ขอแสดงความยินดี
    </text>
    <text x="147" y="107" fill="#b45309" font-family="'Sarabun', sans-serif" font-size="13" font-weight="semibold" text-anchor="middle">
      เชิดชูเกียรติครูผู้สอนดีเด่น
    </text>

    <!-- Award Name Highlight Box -->
    <rect x="15" y="125" width="265" height="60" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="147" y="150" fill="#047857" font-family="'Sarabun', sans-serif" font-size="15" font-weight="black" text-anchor="middle">
      รางวัลครูผู้ฝึกสอนยอดเยี่ยม
    </text>
    <text x="147" y="172" fill="#065f46" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ระดับเหรียญทอง การแข่งขันทักษะวิชาชีพระดับชาติ
    </text>

    <!-- Recipient & Department -->
    <text x="147" y="215" fill="#1e293b" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      นายสุรศักดิ์ วงศ์สวรรค์
    </text>
    <text x="147" y="238" fill="#059669" font-family="'Sarabun', sans-serif" font-size="12" font-weight="semibold" text-anchor="middle">
      แผนกวิชาการบัญชี วิทยาลัยเทคนิคตราด
    </text>

    <line x1="30" y1="260" x2="265" y2="260" stroke="#6ee7b7" stroke-width="1"/>

    <!-- Pride Tagline -->
    <text x="147" y="285" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      ต้นแบบครูมืออาชีพเพื่อผู้เรียน
    </text>
    <text x="147" y="306" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11" font-style="italic" text-anchor="middle">
      มุ่งมั่น ทุ่มเท สร้างศิษย์สู่ความสำเร็จ
    </text>
  </g>

  <!-- Right: Certificate / Award Ribbon Showcase Frame -->
  <g transform="translate(355, 105)">
    <rect x="0" y="0" width="210" height="330" rx="16" fill="#ffffff" filter="drop-shadow(0px 10px 15px rgba(0,0,0,0.08))"/>
    <rect x="0" y="0" width="210" height="330" rx="16" fill="#f8fafc" stroke="#10b981" stroke-width="2"/>

    <!-- Certificate Visual -->
    <g transform="translate(15, 20)">
      <radialGradient id="certGlow" cx="50%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#ecfdf5"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </radialGradient>
      <rect x="0" y="0" width="180" height="200" rx="12" fill="url(#certGlow)" stroke="#a7f3d0"/>

      <!-- Certificate Border -->
      <rect x="15" y="15" width="150" height="170" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <rect x="20" y="20" width="140" height="160" rx="4" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="2,2"/>

      <!-- Certificate Header -->
      <circle cx="90" cy="45" r="14" fill="#047857"/>
      <polygon points="90,36 93,42 99,42 94,46 96,52 90,48 84,52 86,46 81,42 87,42" fill="#fde047"/>

      <rect x="40" y="68" width="100" height="4" fill="#065f46" rx="2"/>
      <rect x="50" y="78" width="80" height="3" fill="#64748b" rx="1"/>
      <rect x="35" y="90" width="110" height="3" fill="#64748b" rx="1"/>
      <rect x="45" y="100" width="90" height="3" fill="#64748b" rx="1"/>

      <!-- Gold Rosette Ribbon -->
      <g transform="translate(90, 140)">
        <polygon points="-12,0 -16,28 -6,22 0,28" fill="#b45309"/>
        <polygon points="12,0 16,28 6,22 0,28" fill="#d97706"/>
        <circle cx="0" cy="0" r="18" fill="url(#ribbonAwardGrad)" stroke="#78350f" stroke-width="1.5"/>
        <text x="0" y="4" fill="#ffffff" font-size="11" font-weight="black" text-anchor="middle">★</text>
      </g>
    </g>

    <!-- Bottom Badge Section -->
    <rect x="15" y="235" width="180" height="75" rx="10" fill="#065f46"/>
    <text x="105" y="260" fill="#fde047" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ★ เชิดชูเกียรติคุณ ★
    </text>
    <text x="105" y="280" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="11" text-anchor="middle">
      สำนักงานคณะกรรมการการอาชีวศึกษา
    </text>
    <text x="105" y="297" fill="#a7f3d0" font-family="'Sarabun', sans-serif" font-size="10" text-anchor="middle">
      กระทรวงศึกษาธิการ
    </text>
  </g>
</svg>

