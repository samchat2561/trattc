<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAward2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="medalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" fill="url(#bgGradAward2)"/>

  <!-- Ornamental Soft Circles -->
  <circle cx="70" cy="70" r="130" fill="#bfdbfe" opacity="0.3"/>
  <circle cx="530" cy="410" r="150" fill="#bbf7d0" opacity="0.3"/>
  <circle cx="530" cy="70" r="100" fill="#fed7aa" opacity="0.3"/>

  <!-- Border Frame -->
  <rect x="12" y="12" width="576" height="456" rx="16" fill="none" stroke="url(#goldGrad2)" stroke-width="3" opacity="0.85"/>
  <rect x="18" y="18" width="564" height="444" rx="12" fill="none" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Top Ribbon Banner -->
  <path d="M 320 25 L 570 25 L 585 45 L 570 65 L 320 65 Z" fill="url(#blueGrad)"/>
  <text x="445" y="48" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    ★ รางวัลแข่งขันทักษะวิชาชีพ ๒๕๖๘
  </text>

  <!-- College Logo Badge / Emblem -->
  <g transform="translate(45, 30)">
    <circle cx="28" cy="28" r="26" fill="#7a1a40" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="34" fill="#fef08a" font-family="'Sarabun', sans-serif" font-size="20" font-weight="black" text-anchor="middle">วทต</text>
  </g>
  <text x="110" y="48" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold">วิทยาลัยเทคนิคตราด</text>
  <text x="110" y="66" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11">Trat Technical College</text>

  <!-- Left Content Box: Announcement -->
  <g transform="translate(35, 105)">
    <rect x="0" y="0" width="295" height="330" rx="14" fill="#ffffff" opacity="0.92" stroke="#bfdbfe" stroke-width="1.5"/>

    <!-- Medal Icon Badge -->
    <circle cx="147" cy="42" r="24" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="147" y="50" font-size="24" text-anchor="middle">🥇</text>

    <text x="147" y="85" fill="#1e3a8a" font-family="'Sarabun', sans-serif" font-size="17" font-weight="bold" text-anchor="middle">
      ขอแสดงความยินดี
    </text>
    <text x="147" y="107" fill="#b45309" font-family="'Sarabun', sans-serif" font-size="13" font-weight="semibold" text-anchor="middle">
      การแข่งขันทักษะวิชาชีพระดับภาค
    </text>

    <!-- Award Name Highlight Box -->
    <rect x="15" y="125" width="265" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="147" y="150" fill="#1e40af" font-family="'Sarabun', sans-serif" font-size="15" font-weight="black" text-anchor="middle">
      รางวัลชนะเลิศ เหรียญทอง
    </text>
    <text x="147" y="172" fill="#1e3a8a" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ทักษะงานยานยนต์ (ระดับ ปวส.)
    </text>

    <!-- Recipient & Department -->
    <text x="147" y="215" fill="#1e293b" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      นายธนกฤต มณีรัตน์ และคณะ
    </text>
    <text x="147" y="238" fill="#059669" font-family="'Sarabun', sans-serif" font-size="12" font-weight="semibold" text-anchor="middle">
      แผนกวิชาช่างยนต์ (ครูผู้ฝึกสอน: นายศิริรักษ์)
    </text>

    <line x1="30" y1="260" x2="265" y2="260" stroke="#93c5fd" stroke-width="1"/>

    <!-- Pride Tagline -->
    <text x="147" y="285" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
      เป็นตัวแทนเข้าแข่งขันระดับชาติ
    </text>
    <text x="147" y="306" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11" font-style="italic" text-anchor="middle">
      สร้างเกียรติยศสู่สถาบัน
    </text>
  </g>

  <!-- Right: Medal Showcase Frame -->
  <g transform="translate(355, 105)">
    <rect x="0" y="0" width="210" height="330" rx="16" fill="#ffffff" filter="drop-shadow(0px 10px 15px rgba(0,0,0,0.08))"/>
    <rect x="0" y="0" width="210" height="330" rx="16" fill="#f8fafc" stroke="#3b82f6" stroke-width="2"/>

    <!-- Medal Visual -->
    <g transform="translate(15, 20)">
      <radialGradient id="medalGlow" cx="50%" cy="40%" r="55%">
        <stop offset="0%" stop-color="#eff6ff"/>
        <stop offset="100%" stop-color="#ffffff"/>
      </radialGradient>
      <rect x="0" y="0" width="180" height="200" rx="12" fill="url(#medalGlow)" stroke="#bfdbfe"/>

      <!-- Ribbons -->
      <polygon points="65,10 80,10 90,80 75,80" fill="#dc2626"/>
      <polygon points="100,10 115,10 105,80 90,80" fill="#2563eb"/>
      <polygon points="80,10 100,10 95,80 85,80" fill="#ffffff"/>

      <!-- Gold Medal -->
      <circle cx="90" cy="115" r="48" fill="url(#medalGrad)" stroke="#b45309" stroke-width="3"/>
      <circle cx="90" cy="115" r="40" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="3,3"/>
      <!-- Star in Medal -->
      <polygon points="90,88 94,103 108,103 97,112 101,126 90,118 79,126 83,112 72,103 86,103" fill="#ffffff"/>
      <text x="90" y="145" fill="#78350f" font-family="'Sarabun', sans-serif" font-size="12" font-weight="black" text-anchor="middle">
        1st PLACE
      </text>
    </g>

    <!-- Bottom Badge Section -->
    <rect x="15" y="235" width="180" height="75" rx="10" fill="#1e3a8a"/>
    <text x="105" y="260" fill="#fde047" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      ★ ภาคตะวันออกและ กทม. ★
    </text>
    <text x="105" y="280" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="11" text-anchor="middle">
      งานประชุมวิชาการ อวท.
    </text>
    <text x="105" y="297" fill="#93c5fd" font-family="'Sarabun', sans-serif" font-size="10" text-anchor="middle">
      องค์การนักวิชาชีพในอนาคตแห่งประเทศไทย
    </text>
  </g>
</svg>

