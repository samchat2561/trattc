<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradNews" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fdf2f8"/>
    </linearGradient>
    <linearGradient id="maroonGradNews" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a1a40"/>
      <stop offset="100%" stop-color="#9e1f55"/>
    </linearGradient>
    <linearGradient id="goldGradNews" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="480" fill="url(#bgGradNews)"/>

  <!-- Ornamental Soft Circles -->
  <circle cx="60" cy="60" r="130" fill="#fbcfe8" opacity="0.4"/>
  <circle cx="540" cy="420" r="160" fill="#fde68a" opacity="0.35"/>
  <circle cx="530" cy="70" r="100" fill="#e0f2fe" opacity="0.3"/>

  <!-- Border Frame -->
  <rect x="12" y="12" width="576" height="456" rx="16" fill="none" stroke="url(#goldGradNews)" stroke-width="2.5" opacity="0.85"/>
  <rect x="18" y="18" width="564" height="444" rx="12" fill="none" stroke="#7a1a40" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Top Ribbon Banner -->
  <path d="M 330 25 L 570 25 L 585 45 L 570 65 L 330 65 Z" fill="url(#maroonGradNews)"/>
  <text x="450" y="48" fill="#ffffff" font-family="'Sarabun', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">
    📰 จดหมายข่าวประชาสัมพันธ์
  </text>

  <!-- College Logo Badge / Emblem -->
  <g transform="translate(45, 30)">
    <circle cx="28" cy="28" r="26" fill="#7a1a40" stroke="#f59e0b" stroke-width="2"/>
    <text x="28" y="34" fill="#fef08a" font-family="'Sarabun', sans-serif" font-size="20" font-weight="black" text-anchor="middle">วทต</text>
  </g>
  <text x="110" y="48" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="15" font-weight="bold">วิทยาลัยเทคนิคตราด</text>
  <text x="110" y="66" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="11">Trat Technical College</text>

  <!-- Center Card: Newsletter Cover Layout -->
  <g transform="translate(45, 105)">
    <!-- White Card Box -->
    <rect x="0" y="0" width="510" height="325" rx="14" fill="#ffffff" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.06))" stroke="#f1f5f9"/>

    <!-- Newsletter Header Emblem -->
    <circle cx="255" cy="45" r="24" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="255" y="53" font-size="24" text-anchor="middle">🗞️</text>

    <text x="255" y="90" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="18" font-weight="black" text-anchor="middle">
      จดหมายข่าวประชาสัมพันธ์
    </text>
    <text x="255" y="112" fill="#64748b" font-family="'Sarabun', sans-serif" font-size="12" text-anchor="middle">
      งานประชาสัมพันธ์ ฝ่ายบริหารทรัพยากร วิทยาลัยเทคนิคตราด
    </text>

    <!-- Headline Box -->
    <rect x="25" y="130" width="460" height="65" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
    <text x="255" y="157" fill="#9f1239" font-family="'Sarabun', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      ข่าวสารความเคลื่อนไหว กิจกรรมวิชาการ และผลงานนักเรียน นักศึกษา
    </text>
    <text x="255" y="178" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="12" font-weight="semibold" text-anchor="middle">
      ติดตามข่าวสารฉบับเต็มและดาวน์โหลดไฟล์เอกสารแนบได้ที่นี่
    </text>

    <!-- File Formats Icons Ribbon -->
    <g transform="translate(60, 215)">
      <!-- PDF -->
      <rect x="0" y="0" width="68" height="42" rx="6" fill="#fef2f2" stroke="#fecaca"/>
      <text x="34" y="26" fill="#dc2626" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📄 PDF</text>

      <!-- DOCX -->
      <rect x="80" y="0" width="68" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="114" y="26" fill="#2563eb" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📝 DOCX</text>

      <!-- XLSX -->
      <rect x="160" y="0" width="68" height="42" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="194" y="26" fill="#16a34a" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📊 XLSX</text>

      <!-- PPTX -->
      <rect x="240" y="0" width="68" height="42" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="274" y="26" fill="#ea580c" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📑 PPTX</text>

      <!-- ZIP -->
      <rect x="320" y="0" width="68" height="42" rx="6" fill="#fffbeb" stroke="#fde68a"/>
      <text x="354" y="26" fill="#d97706" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">📦 ZIP</text>
    </g>

    <line x1="40" y1="275" x2="470" y2="275" stroke="#f1f5f9" stroke-width="1.5"/>

    <text x="255" y="302" fill="#7a1a40" font-family="'Sarabun', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      วิทยาลัยเทคนิคตราด มุ่งมั่นสื่อสารสร้างสรรค์ ทันเหตุการณ์ สู่สังคม
    </text>
  </g>
</svg>
